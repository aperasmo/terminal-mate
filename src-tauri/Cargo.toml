[package]
name = "terminal-mate"
version = "0.1.0"
description = "Safety-first terminal workspace"
authors = ["Allan P. Erasmo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "terminal_mate_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.7"
uuid = { version = "1", features = ["v4"] }

